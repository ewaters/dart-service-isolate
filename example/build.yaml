targets:
  $default:
    sources:
      - $package$
      - lib/$lib$
      - proto/**
    builders:
      protoc_builder:
        options:
          proto_paths:
            - "proto/"
          out_dir: "lib/src/generated"
      service_isolate:
        options:
          # Upstream protoc_builder does not write descriptor sets. Regenerate
          # proto/chat_service.descriptor.pb after editing the .proto:
          #   protoc --include_imports --proto_path=proto \
          #     --descriptor_set_out=proto/chat_service.descriptor.pb \
          #     proto/chat_service.proto
          descriptor_dir: "proto"
          generated_dir: "lib/src/generated"
          user_created_dir: "lib/src/services"
